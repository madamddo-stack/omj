<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오먹지 🍽 — 교대 점심 맛집</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header class="header">
      <div class="header-inner">
        <div>
          <h1 class="logo">오먹지 <span class="logo-sub">🍽</span></h1>
          <p class="header-desc">교대 근처 점심 맛집 · 동익성봉빌딩 기준 도보거리</p>
        </div>
        <div id="weatherBox" class="weather-box">
          <span id="weatherIcon" class="weather-icon">—</span>
          <div class="weather-info">
            <span id="weatherLabel" class="weather-label">날씨 불러오는 중</span>
            <span id="weatherSub" class="weather-sub"></span>
          </div>
          <span id="weatherTip" class="weather-tip"></span>
        </div>
      </div>
    </header>

    <main class="main">

      <!-- 추천 결과 모달 -->
      <div id="modalOverlay" class="modal-overlay hidden">
      <div id="resultCard" class="result-card">
        <p class="result-label" id="resultLabel">오늘의 추천</p>

        <div class="slot-machine">
          <div class="slot-col" id="slotName"></div>
          <div class="slot-col" id="slotMenu"></div>
          <div class="slot-col" id="slotCat"></div>
        </div>

        <div class="result-info hidden" id="resultInfo">
          <div class="result-thumb" id="resultThumb"></div>
          <div class="result-detail">
            <div class="result-name-row">
              <strong class="result-name" id="resultName"></strong>
              <span class="result-cat-badge" id="resultCatBadge"></span>
            </div>
            <p class="result-meta" id="resultMeta"></p>
            <p class="result-point" id="resultPoint"></p>
          </div>
        </div>

        <div class="result-actions">
          <button class="btn-reroll" id="rerollBtn"><span class="material-icons mi-sm">replay</span> 다시 뽑기</button>
          <button class="btn-decide" id="confirmBtn">이걸로 결정! <span class="material-icons mi-sm">arrow_forward</span></button>
        </div>
      </div>
      </div>

      <!-- 날씨 히어로 카드 -->
      <div id="weatherHero" class="weather-hero hidden">
        <div class="weather-hero-left">
          <div class="weather-hero-label" id="heroLabel"></div>
          <p class="weather-hero-msg" id="heroMsg"></p>
        </div>
        <div class="weather-hero-right" id="heroRec"></div>
        <span class="weather-hero-deco" id="heroDeco"></span>
      </div>

      <!-- 컨트롤 -->
      <div class="controls">
        <div class="cat-filters" id="catFilters">
          <button class="cat-btn active" data-cat="전체">전체</button>
          <button class="cat-btn" data-cat="밥">🍚 밥</button>
          <button class="cat-btn" data-cat="국물">🍲 국물</button>
          <button class="cat-btn" data-cat="면">🍜 면</button>
          <button class="cat-btn" data-cat="고기">🥩 고기</button>
          <button class="cat-btn" data-cat="가볍게">🥗 가볍게</button>
        </div>
      </div>

      <div class="sub-filters" id="subFilters">
        <button class="sub-btn" data-filter="min7"><span class="material-icons mi-xs">bolt</span> 7분컷</button>
        <button class="sub-btn" data-filter="honja"><span class="material-icons mi-xs">person</span> 혼밥 가능</button>
        <button class="sub-btn" data-filter="safe"><span class="material-icons mi-xs">sentiment_satisfied</span> 안 붐빔</button>
        <button class="sub-btn" data-filter="cheap"><span class="material-icons mi-xs">payments</span> 1만원 이하</button>
      </div>

      <div class="list-meta">
        <span id="countText" class="count-text"></span>
      </div>

      <!-- 카드 그리드 -->
      <div class="grid" id="grid"></div>

    </main>
  <!-- 식당 등록 모달 -->
  <div id="registerOverlay" class="modal-overlay hidden">
    <div class="register-card">
      <div class="register-header">
        <h3 class="register-title">식당 / 메뉴 등록</h3>
        <button class="register-close" id="registerClose">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">식당명 *</label>
        <input type="text" id="regName" class="form-input" placeholder="식당 이름을 입력하세요" list="restaurantList" autocomplete="off" />
        <datalist id="restaurantList"></datalist>
        <div id="regDetect" class="reg-detect hidden"></div>
      </div>

      <div class="form-group">
        <label class="form-label">메뉴명 *</label>
        <input type="text" id="regMenu" class="form-input" placeholder="추천 메뉴를 입력하세요" />
      </div>

      <div id="newRestaurantFields" class="hidden">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">카테고리 *</label>
            <select id="regCat" class="form-input">
              <option value="">선택</option>
              <option value="밥">🍚 밥</option>
              <option value="국물">🍲 국물</option>
              <option value="면">🍜 면</option>
              <option value="고기">🥩 고기</option>
              <option value="가볍게">🥗 가볍게</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">도보 (분) *</label>
            <input type="number" id="regWalk" class="form-input" placeholder="예: 7" min="1" max="20" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">가격 (원) *</label>
            <input type="number" id="regPrice" class="form-input" placeholder="예: 13000" />
          </div>
          <div class="form-group">
            <label class="form-label">혼밥</label>
            <select id="regHonja" class="form-input">
              <option value="매우좋음">매우 좋음</option>
              <option value="좋음">좋음</option>
              <option value="가능" selected>가능</option>
              <option value="애매">애매</option>
              <option value="비추천">비추천</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">네이버 지도 URL</label>
          <input type="url" id="regNaver" class="form-input" placeholder="https://map.naver.com/..." />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">등록자 닉네임 *</label>
        <input type="text" id="regSubmitter" class="form-input" placeholder="예: 민지" />
      </div>

      <button class="btn-submit" id="regSubmitBtn">등록하기</button>
    </div>
  </div>

    <!-- 스티키 하단 바 -->
    <div class="sticky-bar">
      <button class="btn-random" id="randomBtn"><span class="material-icons mi-sm">casino</span> 랜덤 뽑기</button>
      <button class="btn-register" id="registerBtn"><span class="material-icons mi-sm">add</span> 식당 등록</button>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
