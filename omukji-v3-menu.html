<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오먹지 v3 🍽 — 교대 점심 맛집</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --bg:             #111111;
      --surface:        #1C1C1C;
      --surface-2:      #242424;
      --surface-3:      #2A2A2A;
      --border:         rgba(255,255,255,0.08);
      --border-hover:   rgba(212,160,23,0.35);
      --text-primary:   #F0EDE8;
      --text-secondary: #888880;
      --text-muted:     #555;
      --accent:         #D4A017;
      --accent-light:   rgba(212,160,23,0.15);
      --accent-hover:   #E5B526;
      --green:          #5FA870;
      --green-light:    rgba(95,168,112,0.18);
      --red:            #E57368;
      --red-light:      rgba(229,115,104,0.15);
      --r-sm:  8px;
      --r-md:  12px;
      --r-lg:  16px;
      --r-xl:  20px;
      --r-pill: 999px;
      --font-title: 'Black Han Sans', sans-serif;
      --font-body:  'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    /* ===== Layout ===== */
    #app { max-width: 780px; margin: 0 auto; padding: 0 16px 100px; }

    /* ===== Header ===== */
    .header {
      padding: 22px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo {
      font-family: var(--font-title);
      font-size: 26px;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .logo-accent { color: var(--accent); }
    .header-desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

    /* ===== Weather Box ===== */
    .weather-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 8px 12px;
      flex-shrink: 0;
    }
    .weather-icon { font-size: 22px; line-height: 1; }
    .weather-info { display: flex; flex-direction: column; gap: 1px; }
    .weather-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .weather-sub   { font-size: 12px; color: var(--text-secondary); }
    .weather-tip {
      display: flex; align-items: center; gap: 3px;
      background: var(--accent-light);
      border: 1px solid rgba(212,160,23,0.3);
      border-radius: var(--r-pill);
      padding: 3px 8px;
      font-size: 12px; color: var(--accent);
    }
    .tip-icon { font-size: 14px; }
    .tip-text  { font-size: 12px; }

    /* ===== Weather Hero ===== */
    .weather-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-radius: var(--r-xl);
      border: 1px solid rgba(255,255,255,0.06);
      border-left: 3px solid var(--accent);
      padding: 20px 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .weather-hero-left { flex: 1; }
    .weather-hero-label {
      font-size: 12px; font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .weather-hero-msg {
      font-family: var(--font-title);
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-line;
    }
    .weather-hero-right {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(6px);
      border-radius: var(--r-md);
      padding: 12px 14px;
      min-width: 140px;
      max-width: 160px;
      flex-shrink: 0;
    }
    .hero-rec-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .hero-rec-menu { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .hero-rec-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .hero-rec-link {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 12px; color: var(--accent);
      margin-top: 8px; transition: color 0.15s;
    }
    .hero-rec-link:hover { color: var(--accent-hover); }
    .weather-hero-deco {
      position: absolute; right: 14px; bottom: 8px;
      font-size: 52px; opacity: 0.12; pointer-events: none;
      line-height: 1;
    }

    /* ===== Controls ===== */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    /* ===== View Toggle Row ===== */
    .view-toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .view-toggle-row .view-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 3px;
      gap: 2px;
    }
    .view-toggle-row .view-btn {
      padding: 7px 20px;
      font-size: 13px;
    }

    /* ===== Category Filters ===== */
    .cat-filters {
      display: flex; gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .cat-filters::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 6px 14px;
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }
    .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cat-btn.active { background: transparent; border-color: var(--accent); color: var(--accent); }

    /* ===== Right Controls ===== */
    .right-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* ===== View Toggle ===== */
    .view-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 3px;
      gap: 2px;
    }
    .view-btn {
      background: none; border: none; cursor: pointer;
      padding: 5px 13px;
      border-radius: var(--r-pill);
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.18s ease;
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }
    .view-btn.active { background: var(--accent); color: #111; }
    .view-btn:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,0.05); }

    /* ===== Random Button ===== */
    .btn-random {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent);
      color: #111;
      border: none; border-radius: var(--r-pill);
      padding: 8px 18px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease;
      white-space: nowrap;
    }
    .btn-random:hover { background: var(--accent-hover); }

    /* ===== Sub Filters ===== */
    .sub-filters {
      display: flex; gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin-bottom: 16px;
    }
    .sub-filters::-webkit-scrollbar { display: none; }
    .sub-btn {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 5px 12px;
      font-size: 12px; font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }
    .sub-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sub-btn.active { background: var(--accent); border-color: var(--accent); color: #111; }

    /* ===== List Meta ===== */
    .list-meta { display: flex; align-items: center; margin-bottom: 12px; }
    .count-text { font-size: 12px; color: var(--text-secondary); }
    .count-text strong { color: var(--accent); font-weight: 600; }

    /* ===== Empty ===== */
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--text-secondary); font-size: 15px; line-height: 2.2;
    }

    /* ===== Material Icons helpers ===== */
    .mi-xs { font-size: 12px !important; vertical-align: -2px; }
    .mi-sm { font-size: 15px !important; vertical-align: -3px; }

    /* ===== Badges ===== */
    .badge {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 2px 7px;
      border-radius: var(--r-pill);
      font-size: 12px; font-weight: 500;
      line-height: 1.4;
    }
    .badge-7min  { background: var(--accent-light);  color: var(--accent); border: 1px solid rgba(212,160,23,0.3); }
    .badge-honja { background: var(--green-light);   color: var(--green);  border: 1px solid rgba(95,168,112,0.3); }
    .badge-safe  { background: var(--green-light);   color: var(--green);  border: 1px solid rgba(95,168,112,0.3); }
    .badge-cheap { background: var(--green-light);   color: var(--green);  border: 1px solid rgba(95,168,112,0.3); }

    /* ===== Restaurant Grid ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 10px;
    }

    /* ===== Restaurant Card ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      display: flex;
      flex-direction: row;
      transition: border-color 0.18s ease, transform 0.15s ease;
    }
    .card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .card-thumb {
      width: 82px; min-width: 82px;
      min-height: 90px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      background: var(--surface-2);
      overflow: hidden;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-body {
      flex: 1; padding: 16px 24px;
      display: flex; flex-direction: column; gap: 3px;
      overflow: hidden;
    }
    .card-title-row {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .card-title-left { display: flex; align-items: baseline; gap: 5px; overflow: hidden; }
    .card-name {
      font-family: var(--font-body);
      font-size: 16px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-cat-label { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
    .card-arrow {
      color: var(--text-muted); flex-shrink: 0;
      display: flex; align-items: center;
      transition: color 0.15s;
    }
    .card-arrow:hover { color: var(--accent); }
    .card-meta { font-size: 12px; color: var(--text-secondary); }
    /* Menu line: ★추천메뉴 +서브1 +서브2 */
    .card-menus { font-size: 12px; line-height: 1.5; }
    .menu-main { color: var(--accent); font-weight: 500; }
    .menu-sub  { color: var(--text-secondary); }
    .card-point { font-size: 12px; color: var(--text-muted); font-style: italic; }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }

    /* ===== Menu View ===== */
    .menu-view { display: flex; flex-direction: column; gap: 24px; }
    .menu-group-header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .menu-group-name {
      font-family: var(--font-title);
      font-size: 17px; color: var(--accent);
    }
    .menu-group-count {
      font-size: 12px; color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      padding: 1px 8px;
    }
    .menu-group-rows { display: flex; flex-direction: column; gap: 7px; }
    .menu-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      transition: border-color 0.18s ease;
    }
    .menu-row:hover { border-color: var(--border-hover); }
    .menu-row-thumb {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; background: var(--surface-2); flex-shrink: 0;
    }
    .menu-row-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .menu-row-info { flex: 1; overflow: hidden; }
    .menu-row-name {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .menu-row-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .menu-row-badge {
      flex-shrink: 0;
      padding: 2px 9px;
      border-radius: var(--r-pill);
      font-size: 12px; font-weight: 500;
    }
    .badge-main { background: var(--accent-light); color: var(--accent);         border: 1px solid rgba(212,160,23,0.3); }
    .badge-sub  { background: rgba(255,255,255,0.04); color: var(--text-secondary); border: 1px solid var(--border); }
    .menu-row-link {
      color: var(--text-muted); flex-shrink: 0;
      display: flex; align-items: center;
      transition: color 0.15s;
    }
    .menu-row-link:hover { color: var(--accent); }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .result-card {
      background: var(--surface);
      border: 1px solid rgba(212,160,23,0.3);
      border-radius: var(--r-xl);
      padding: 24px;
      width: 100%; max-width: 440px;
      animation: modal-in 0.22s ease;
    }
    @keyframes modal-in {
      from { transform: scale(0.92) translateY(12px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
    .result-label {
      font-family: var(--font-title);
      font-size: 12px; color: var(--accent);
      text-align: center; letter-spacing: 1.5px;
      margin-bottom: 14px;
    }
    .slot-machine {
      display: flex; gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 8px 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .slot-col {
      flex: 1; display: flex; flex-direction: column;
      text-align: center; overflow: hidden; gap: 2px;
    }
    .slot-item {
      padding: 4px 2px;
      font-size: 12px;
      border-radius: 4px;
      transition: color 0.1s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .slot-dim    { color: var(--text-muted); }
    .slot-active { color: var(--text-primary); font-weight: 600; font-size: 13px; }
    .slot-final  { color: var(--accent); }

    .result-info {
      display: flex; gap: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 14px;
      margin-bottom: 14px;
      animation: modal-in 0.2s ease;
    }
    .result-thumb {
      width: 64px; min-width: 64px; height: 64px;
      border-radius: var(--r-sm); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; background: var(--surface-3);
    }
    .result-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .result-detail { flex: 1; overflow: hidden; }
    .result-name-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .result-name {
      font-family: var(--font-body);
      font-size: 20px; font-weight: 700; color: var(--text-primary);
    }
    .result-cat-badge { font-size: 12px; color: var(--text-secondary); }
    .result-meta  { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .result-point { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 3px; }

    .result-actions { display: flex; gap: 8px; }
    .btn-reroll {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--text-secondary);
      font-size: 13px; font-weight: 500;
      padding: 10px 16px; cursor: pointer;
      transition: border-color 0.18s, color 0.18s;
    }
    .btn-reroll:hover { border-color: var(--accent); color: var(--accent); }
    .btn-decide {
      flex: 1.5; display: flex; align-items: center; justify-content: center; gap: 5px;
      background: var(--accent);
      border: none; border-radius: var(--r-pill);
      color: #111;
      font-size: 13px; font-weight: 700;
      padding: 10px 16px; cursor: pointer;
      transition: background 0.18s;
    }
    .btn-decide:hover { background: var(--accent-hover); }

    /* ===== Register Button ===== */
    .btn-register {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-pill);
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 13px; font-weight: 500;
      padding: 8px 16px; cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-register:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== Register Modal ===== */
    .register-card {
      background: var(--surface);
      border: 1px solid rgba(212,160,23,0.3);
      border-radius: var(--r-xl);
      padding: 24px;
      width: 100%; max-width: 460px;
      animation: modal-in 0.22s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    .register-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .register-title {
      font-family: var(--font-body);
      font-size: 18px; font-weight: 700; color: var(--text-primary);
    }
    .register-close {
      background: none; border: none;
      color: var(--text-muted); font-size: 18px;
      cursor: pointer; padding: 2px 8px;
      border-radius: 4px; transition: color 0.15s;
    }
    .register-close:hover { color: var(--text-primary); }
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: 12px;
      color: var(--text-secondary); margin-bottom: 5px;
    }
    .form-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 9px 12px;
      font-size: 13px; color: var(--text-primary);
      outline: none; transition: border-color 0.18s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input option { background: var(--surface-2); color: var(--text-primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .reg-detect {
      font-size: 12px; margin-top: 6px;
      padding: 6px 10px; border-radius: var(--r-sm);
    }
    .reg-detect.existing {
      background: var(--accent-light); color: var(--accent);
      border: 1px solid rgba(212,160,23,0.3);
    }
    .reg-detect.new {
      background: var(--green-light); color: var(--green);
      border: 1px solid rgba(95,168,112,0.3);
    }
    .btn-submit {
      width: 100%;
      background: var(--accent); color: #111;
      border: none; border-radius: var(--r-pill);
      padding: 12px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 6px;
      transition: background 0.18s;
    }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:disabled { background: var(--surface-3); color: var(--text-muted); cursor: not-allowed; }

    /* ===== Sticky Bottom Bar ===== */
    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 780px;
      display: flex;
      gap: 10px;
      padding: 12px 16px 20px;
      background: linear-gradient(to top, #111111 60%, transparent);
      z-index: 100;
    }
    .sticky-bar .btn-random {
      flex: 2;
      justify-content: center;
      border-radius: var(--r-pill);
      padding: 13px 20px;
      font-size: 14px;
      box-shadow: 0 4px 20px rgba(212,160,23,0.25);
    }
    .sticky-bar .btn-register {
      flex: 1;
      justify-content: center;
      border-radius: var(--r-pill);
      padding: 13px 20px;
      font-size: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    /* ===== Responsive ===== */
    @media (max-width: 520px) {
      .header-inner { flex-direction: column; align-items: flex-start; gap: 10px; }
      .weather-box  { align-self: stretch; }
      .controls     { flex-direction: column; align-items: flex-start; }

      .weather-hero { flex-direction: column; }
      .weather-hero-right { min-width: unset; max-width: unset; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ====== Modal ====== -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="result-card" id="resultCard">
      <p class="result-label" id="resultLabel">오늘의 추천</p>

      <div class="slot-machine">
        <div class="slot-col" id="slotName"></div>
        <div class="slot-col" id="slotMenu"></div>

      <div class="result-info hidden" id="resultInfo">

        <div class="result-detail">

  <!-- ====== Sticky Bottom Bar ====== -->
  <div class="sticky-bar">

  <!-- ====== Register Modal ====== -->
  <div id="registerOverlay" class="modal-overlay hidden">

      <div class="form-group">

      <div class="form-group">

      <div id="newRestaurantFields" class="hidden">
        <div class="form-row">
          <div class="form-group">

              <option value="">선택</option>

            <label class="form-label">혼밥</label>

              <option value="매우좋음">매우 좋음</option>
              <option value="좋음">좋음</option>
              <option value="가능" selected>가능</option>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxdocDjKI_oS7iJde-DIH6WgX1FiKogdRviTbeAXSn0FUAxNaAyqr24CZ2lAlnm3ucf/exec';
let restaurants = [];

/* ---- Category styles (dark palette) ---- */
const CAT_STYLE = {
  '밥':    { bg: 'rgba(212,160,23,0.12)',  emoji: '🍚' },
  '국물':  { bg: 'rgba(192,57,43,0.18)',   emoji: '🍲' },
  '면':    { bg: 'rgba(212,160,23,0.08)',   emoji: '🍜' },
  '고기':  { bg: 'rgba(139,94,60,0.22)',   emoji: '🥩' },
  '가볍게': { bg: 'rgba(74,124,89,0.22)',   emoji: '🥗' },
};

/* ---- State ---- */
let state = {
  view: 'restaurant',   // 'restaurant' | 'menu'
  category: '전체',
  filters: { min7: false, honja: false, safe: false, cheap: false },
  weather: null,
  filtered: [],
  picked: null,
};
let spinInterval = null;

/* ---- Helpers ---- */
function formatPrice(p) {
  if (!p) return '-';
  return p >= 10000 ? `₩${(p / 10000).toFixed(1)}만` : `₩${p.toLocaleString()}`;
}
function naverLink(name) {
  return `https://map.naver.com/v5/search/${encodeURIComponent(name + ' 교대')}`;
}

/* ---- Filter ---- */
function getFiltered() {
  return restaurants.filter(r => {
    if (state.category !== '전체' && r.cat !== state.category) return false;
    if (state.filters.min7  && !r.min7) return false;
    if (state.filters.honja && !['가능','좋음','매우좋음'].includes(r.honja)) return false;
    if (state.filters.safe  && r.safe === '붐빔') return false;
    if (state.filters.cheap && r.price > 10000) return false;
    return true;
  });
}

/* ---- Render Restaurant Card ---- */
function renderCard(r) {
  const link = r.naver || naverLink(r.name);
  const cat  = CAT_STYLE[r.cat] || { bg: 'rgba(255,255,255,0.05)', emoji: '🍽' };
  const hasImg = r.img && r.img !== 'URL' && r.img !== '';
  const thumb = hasImg
    ? `<div class="card-thumb"><img src="${r.img}" alt="${r.menu || r.name}" loading="lazy" /></div>`
    : `<div class="card-thumb" style="background:${cat.bg}">${cat.emoji}</div>`;

  /* Menu line: ★추천 +서브1 +서브2 */
  let menuLine = '';
  const hasSubs = r.submenus && r.submenus.length > 0;
  if (r.menu || hasSubs) {
    const parts = [];
    if (r.menu) parts.push(`<span class="menu-main">${r.menu}</span>`);
    if (hasSubs) r.submenus.forEach(s => parts.push(`<span class="menu-sub"> +${s}</span>`));
    menuLine = `<p class="card-menus">${parts.join('')}</p>`;
  }

  const honjaOK = ['가능','좋음','매우좋음'].includes(r.honja);

  return `
    <div class="card">
      ${thumb}
      <div class="card-body">
        <div class="card-title-row">
          <div class="card-title-left">
            <span class="card-name">${r.name}</span>
            <span class="card-cat-label">· ${r.cat}</span>
          </div>
          <a class="card-arrow" href="${link}" target="_blank" rel="noopener" aria-label="${r.name} 네이버 지도">
            <span class="material-icons mi-sm">open_in_new</span>
          </a>
        </div>
        <p class="card-meta">도보 ${r.walk ?? '?'}분 · ${formatPrice(r.price)}</p>
        ${menuLine}
        ${r.point ? `<p class="card-point">"${r.point}"</p>` : ''}
        <div class="badges">
          ${r.min7   ? '<span class="badge badge-7min"><span class="material-icons mi-xs">bolt</span> 7분컷</span>' : ''}
          ${honjaOK  ? '<span class="badge badge-honja"><span class="material-icons mi-xs">person</span> 혼밥</span>' : ''}
          ${r.safe !== '붐빔' ? '<span class="badge badge-safe"><span class="material-icons mi-xs">sentiment_satisfied</span> 안붐빔</span>' : ''}
          ${r.price && r.price <= 10000 ? '<span class="badge badge-cheap"><span class="material-icons mi-xs">payments</span> 1만원↓</span>' : ''}
        </div>
      </div>
    </div>`;
}

/* ---- Render Menu View ---- */
function renderMenuView() {
  const menuMap = new Map();

  state.filtered.forEach(r => {
    if (r.menu) {
      if (!menuMap.has(r.menu)) menuMap.set(r.menu, []);
      menuMap.get(r.menu).push({ r, isMain: true });
    }
    if (r.submenus && r.submenus.length > 0) {
      r.submenus.forEach(sub => {
        if (!sub.trim()) return;
        if (!menuMap.has(sub)) menuMap.set(sub, []);
        menuMap.get(sub).push({ r, isMain: false });
      });
    }
  });

  /* Sort: ★추천(isMain) 많은 순 → 전체 개수 순 */
  const sorted = [...menuMap.entries()].sort((a, b) => {
    const mainA = a[1].filter(e => e.isMain).length;
    const mainB = b[1].filter(e => e.isMain).length;
    if (mainB !== mainA) return mainB - mainA;
    return b[1].length - a[1].length;
  });

  const menuView = document.getElementById('menuView');
  if (sorted.length === 0) {
    menuView.innerHTML = '<div class="empty">조건에 맞는 메뉴가 없어요 😅<br><small>필터를 조정해보세요</small></div>';
    return;
  }

  menuView.innerHTML = sorted.map(([menuName, entries]) => {
    const rows = entries.map(({ r, isMain }) => {
      const link  = r.naver || naverLink(r.name);
      const cat   = CAT_STYLE[r.cat] || { bg: 'rgba(255,255,255,0.05)', emoji: '🍽' };
      const hasImg = r.img && r.img !== 'URL' && r.img !== '';
      const thumb  = hasImg
        ? `<div class="menu-row-thumb"><img src="${r.img}" alt="${r.name}" loading="lazy" /></div>`
        : `<div class="menu-row-thumb" style="background:${cat.bg}">${cat.emoji}</div>`;
      const badge = isMain
        ? `<span class="menu-row-badge badge-main">★ 추천</span>`
        : `<span class="menu-row-badge badge-sub">서브</span>`;
      return `
        <div class="menu-row">
          ${thumb}
          <div class="menu-row-info">
            <div class="menu-row-name">${r.name}</div>
            <div class="menu-row-meta">${r.cat} · 도보 ${r.walk ?? '?'}분 · ${formatPrice(r.price)}</div>
          </div>
          ${badge}
          <a class="menu-row-link" href="${link}" target="_blank" rel="noopener" aria-label="${r.name} 네이버 지도">
            <span class="material-icons mi-sm">open_in_new</span>
          </a>
        </div>`;
    }).join('');

    return `
      <div class="menu-group">
        <div class="menu-group-header">
          <span class="menu-group-name">${menuName}</span>
          <span class="menu-group-count">${entries.length}곳</span>
        </div>
        <div class="menu-group-rows">${rows}</div>
      </div>`;
  }).join('');
}

/* ---- Render (top-level) ---- */
function render() {
  state.filtered = getFiltered();
  const grid     = document.getElementById('grid');
  const menuView = document.getElementById('menuView');
  const count    = document.getElementById('countText');

  count.innerHTML = `<strong>${state.filtered.length}곳</strong> 표시 중`;

  if (state.view === 'restaurant') {
    grid.classList.remove('hidden');
    menuView.classList.add('hidden');
    grid.innerHTML = state.filtered.length
      ? state.filtered.map(renderCard).join('')
      : '<div class="empty">조건에 맞는 식당이 없어요 😅<br><small>필터를 조정해보세요</small></div>';
  } else {
    grid.classList.add('hidden');
    menuView.classList.remove('hidden');
    renderMenuView();
  }
}

/* ---- View Toggle ---- */
document.getElementById('viewToggle').addEventListener('click', e => {
  const btn = e.target.closest('.view-btn');
  if (!btn) return;
  state.view = btn.dataset.view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

/* ---- Category Filter ---- */
document.getElementById('catFilters').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  state.category = btn.dataset.cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

/* ---- Sub Filters ---- */
document.getElementById('subFilters').addEventListener('click', e => {
  const btn = e.target.closest('.sub-btn');
  if (!btn) return;
  const key = btn.dataset.filter;
  state.filters[key] = !state.filters[key];
  btn.classList.toggle('active', state.filters[key]);
  render();
});

/* ---- Slot Machine ---- */
function setSlotCol(id, top, mid, bot, isFinal) {
  document.getElementById(id).innerHTML = `
    <div class="slot-item slot-dim">${top}</div>
    <div class="slot-item slot-active${isFinal ? ' slot-final' : ''}">${mid}</div>
    <div class="slot-item slot-dim">${bot}</div>`;
}
function setSlotCols(prev, curr, next, isFinal) {
  setSlotCol('slotName', prev.name, curr.name, next.name, isFinal);
  setSlotCol('slotMenu', prev.menu || prev.cat, curr.menu || curr.cat, next.menu || next.cat, isFinal);
  setSlotCol('slotCat',  prev.cat,  curr.cat,  next.cat,  isFinal);
}

function showResultInfo(r) {
  const cat    = CAT_STYLE[r.cat] || { emoji: '🍽' };
  const hasImg = r.img && r.img !== 'URL' && r.img !== '';
  document.getElementById('resultThumb').innerHTML = hasImg
    ? `<img src="${r.img}" alt="${r.name}" />`
    : cat.emoji;
  document.getElementById('resultName').textContent     = r.name;
  document.getElementById('resultCatBadge').textContent = `· ${r.cat}`;
  document.getElementById('resultMeta').textContent     = `${r.menu || '-'} · 도보 ${r.walk ?? '?'}분 · ${formatPrice(r.price)}`;
  document.getElementById('resultPoint').textContent    = r.point ? `"${r.point}"` : '';
  document.getElementById('resultInfo').classList.remove('hidden');
}

function runSlot(final, label = '오늘의 추천') {
  const pool = state.filtered.length ? state.filtered : restaurants;
  document.getElementById('resultLabel').textContent = label;
  document.getElementById('resultInfo').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('hidden');
  if (spinInterval) clearInterval(spinInterval);

  let ticks = 0;
  spinInterval = setInterval(() => {
    ticks++;
    if (ticks < 20) {
      const i = Math.floor(Math.random() * pool.length);
      setSlotCols(pool[(i-1+pool.length)%pool.length], pool[i], pool[(i+1)%pool.length], false);
    } else {
      clearInterval(spinInterval); spinInterval = null;
      const fi = pool.indexOf(final) !== -1 ? pool.indexOf(final) : 0;
      setSlotCols(pool[(fi-1+pool.length)%pool.length], final, pool[(fi+1)%pool.length], true);
      state.picked = final;
      setTimeout(() => showResultInfo(final), 150);
    }
  }, 80);
}

function pickRandom(list, label) {
  if (!list.length) return;
  runSlot(list[Math.floor(Math.random() * list.length)], label);
}

document.getElementById('randomBtn').addEventListener('click', () => {
  pickRandom(state.filtered.length ? state.filtered : restaurants, '오늘의 랜덤 점심');
});
document.getElementById('rerollBtn').addEventListener('click', () => {
  pickRandom(state.filtered.length ? state.filtered : restaurants, '다시 뽑기');
});

function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

document.getElementById('confirmBtn').addEventListener('click', () => {
  if (state.picked) window.open(state.picked.naver || naverLink(state.picked.name), '_blank', 'noopener');
  closeModal();
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---- Weather ---- */
function getWeatherCandidates() {
  const w = state.weather;
  if (w === 'rain' || w === 'freeze' || w === 'cold') return restaurants.filter(r => r.cat === '국물');
  if (w === 'chilly') return restaurants.filter(r => r.cat === '국물' || r.cat === '고기');
  if (w === 'warm' || w === 'hot')  return restaurants.filter(r => r.cat === '가볍게' || r.cat === '면');
  return restaurants;
}

function renderHeroRec() {
  const pool = getWeatherCandidates();
  if (!pool.length) return;
  const r    = pool[Math.floor(Math.random() * pool.length)];
  const link = r.naver || naverLink(r.name);
  document.getElementById('heroRec').innerHTML = `
    <div class="hero-rec-name">${r.name}</div>
    <div class="hero-rec-menu">${r.menu || r.cat}</div>
    <div class="hero-rec-meta">도보 ${r.walk ?? '?'}분 · ${formatPrice(r.price)}</div>
    <a class="hero-rec-link" href="${link}" target="_blank" rel="noopener">
      <span class="material-icons mi-xs">open_in_new</span> 지도
    </a>`;
}

async function loadWeather() {
  try {
    const res  = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.4932&longitude=127.0136&current=temperature_2m,precipitation,weathercode&timezone=Asia/Seoul');
    const data = await res.json();
    const temp   = Math.round(data.current.temperature_2m);
    const precip = data.current.precipitation;
    const code   = data.current.weathercode;

    let icon, label, sub;
    if (precip > 0 || (code >= 51 && code <= 99)) {
      icon = '🌧'; label = `비 · ${temp}°C`; sub = '따뜻한 국물 어때요?';        state.weather = 'rain';
    } else if (temp <= 0) {
      icon = '❄️'; label = `영하 · ${temp}°C`; sub = '뜨끈한 국물이 간절한 날'; state.weather = 'freeze';
    } else if (temp <= 7) {
      icon = '🥶'; label = `추움 · ${temp}°C`; sub = '뜨끈한 국물 강추!';        state.weather = 'cold';
    } else if (temp <= 14) {
      icon = '🧥'; label = `쌀쌀 · ${temp}°C`; sub = '든든하게 먹어요';          state.weather = 'chilly';
    } else if (temp <= 22) {
      icon = '😊'; label = `적당 · ${temp}°C`; sub = '뭐든 다 맛있는 날';        state.weather = 'mild';
    } else if (temp <= 27) {
      icon = '🌤'; label = `따뜻 · ${temp}°C`; sub = '산뜻한 메뉴 어때요?';     state.weather = 'warm';
    } else {
      icon = '🌡'; label = `더움 · ${temp}°C`; sub = '시원하고 가볍게!';          state.weather = 'hot';
    }

    const tipEl = document.getElementById('weatherTip');
    if      (state.weather === 'rain') tipEl.innerHTML = `<span class="tip-icon">☂️</span><span class="tip-text">우산 챙기세요</span>`;
    else if (state.weather === 'hot')  tipEl.innerHTML = `<span class="tip-icon">🕶️</span><span class="tip-text">썬글라스 챙기세요</span>`;
    else tipEl.innerHTML = '';

    document.getElementById('weatherIcon').textContent  = icon;
    document.getElementById('weatherLabel').textContent = label;
    document.getElementById('weatherSub').textContent   = sub;

    const HERO = {
      rain:   { bg: 'linear-gradient(135deg,#111d2e 0%,#152035 100%)', deco:'🌧', label:'🌧 Rainy',       msg:'비 오는 날엔\n따뜻한 국물 한 그릇\n어떠세요?' },
      freeze: { bg: 'linear-gradient(135deg,#0e1928 0%,#152234 100%)', deco:'❄️', label:'❄️ Freezing',    msg:'꽁꽁 언 오늘\n뜨끈한 국물이\n간절한 날이에요' },
      cold:   { bg: 'linear-gradient(135deg,#0e1928 0%,#152234 100%)', deco:'🥶', label:'🥶 Cold',         msg:'추운 날엔\n뜨끈한 국물로\n속을 채워요' },
      chilly: { bg: 'linear-gradient(135deg,#1a1510 0%,#2a1e0e 100%)', deco:'🧥', label:'🧥 Chilly',       msg:'쌀쌀한 오늘\n든든한 한 끼로\n따뜻하게 시작해요' },
      mild:   { bg: 'linear-gradient(135deg,#121a13 0%,#1a2a1a 100%)', deco:'😊', label:'😊 Perfect',      msg:'딱 좋은 날씨\n오늘은 뭐든\n다 맛있어요' },
      warm:   { bg: 'linear-gradient(135deg,#1a1600 0%,#2a2000 100%)', deco:'🌤', label:'🌤 Warm',         msg:'따뜻한 오늘\n산뜻한 메뉴로\n가볍게 가볼까요?' },
      hot:    { bg: 'linear-gradient(135deg,#1a0f00 0%,#2a1500 100%)', deco:'☁️', label:'🌡 Sunny & Hot',  msg:'무더운 오늘\n시원한 면 메뉴로\n가볍게 가볼까요?' },
    };

    // 날씨 히어로 카드 — 임시 숨김
    // const h = HERO[state.weather];
    // if (h) { ... }
  } catch {
    document.getElementById('weatherLabel').textContent = '날씨 정보 없음';
    document.getElementById('weatherSub').textContent   = '랜덤 추천을 이용해보세요';
  }
}

/* ---- Register Form ---- */
function openRegisterModal() {
  const dl = document.getElementById('restaurantList');
  dl.innerHTML = restaurants.map(r => `<option value="${r.name}">`).join('');
  document.getElementById('registerOverlay').classList.remove('hidden');
}
function closeRegisterModal() {
  document.getElementById('registerOverlay').classList.add('hidden');
  ['regName','regMenu','regSubmitter','regNaver'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('regDetect').className = 'reg-detect hidden';
  document.getElementById('regDetect').textContent = '';
  document.getElementById('newRestaurantFields').classList.add('hidden');
  const btn = document.getElementById('regSubmitBtn');
  btn.disabled = false; btn.textContent = '등록하기';
}

document.getElementById('registerBtn').addEventListener('click', openRegisterModal);
document.getElementById('registerClose').addEventListener('click', closeRegisterModal);
document.getElementById('registerOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeRegisterModal();
});

document.getElementById('regName').addEventListener('input', e => {
  const name = e.target.value.trim();
  const detect    = document.getElementById('regDetect');
  const newFields = document.getElementById('newRestaurantFields');
  if (!name) { detect.className = 'reg-detect hidden'; newFields.classList.add('hidden'); return; }
  const exists = restaurants.find(r => r.name === name);
  if (exists) {
    detect.className = 'reg-detect existing';
    detect.textContent = '✅ 기존 식당이에요 — 서브메뉴로 추가될게요';
    newFields.classList.add('hidden');
  } else {
    detect.className = 'reg-detect new';
    detect.textContent = '🆕 새 식당이에요 — 추가 정보를 입력해주세요';
    newFields.classList.remove('hidden');
  }
});

document.getElementById('regSubmitBtn').addEventListener('click', async () => {
  const name      = document.getElementById('regName').value.trim();
  const menu      = document.getElementById('regMenu').value.trim();
  const submitter = document.getElementById('regSubmitter').value.trim();
  if (!name || !menu || !submitter) { alert('식당명, 메뉴명, 등록자 닉네임은 필수예요!'); return; }

  const exists  = restaurants.find(r => r.name === name);
  const payload = { name, menu, submitter };

  if (!exists) {
    const cat   = document.getElementById('regCat').value;
    const walk  = document.getElementById('regWalk').value;
    const price = document.getElementById('regPrice').value;
    if (!cat || !walk || !price) { alert('카테고리, 도보시간, 가격은 필수예요!'); return; }
    Object.assign(payload, {
      cat, walk: Number(walk), price: Number(price),
      honja: document.getElementById('regHonja').value,
      naver: document.getElementById('regNaver').value,
      safe: '보통', point: '', submenus: '', img: ''
    });
  }

  const btn = document.getElementById('regSubmitBtn');
  btn.disabled = true; btn.textContent = '등록 중…';

  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
      mode: 'no-cors'
    });
    btn.textContent = '등록 완료! ✅';
    setTimeout(async () => {
      closeRegisterModal();
      // 데이터 새로고침
      const res = await fetch(SHEET_URL);
      restaurants = await res.json();
      render();
    }, 1200);
  } catch {
    alert('오류가 발생했어요. 다시 시도해주세요.');
    btn.disabled = false; btn.textContent = '등록하기';
  }
});

/* ---- Init ---- */
async function init() {
  document.getElementById('grid').innerHTML = '<div class="empty">데이터 불러오는 중…</div>';
  try {
    const res = await fetch(SHEET_URL);
    restaurants = await res.json();
  } catch {
    document.getElementById('grid').innerHTML = '<div class="empty">데이터를 불러올 수 없어요 😅<br><small>잠시 후 새로고침 해보세요</small></div>';
    return;
  }
  loadWeather();
  render();
}
init();
</script>
